<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Kebugaran Jasmani - Class 7 SMP</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter & Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
        }
        .heading-font {
            font-family: 'Outfit', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .pulse-btn {
            animation: pulse-glow 2s infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(236, 72, 153, 0.5); }
            50% { box-shadow: 0 0 25px rgba(236, 72, 153, 0.8); }
        }
        .option-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .option-btn:hover:not(:disabled) {
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="flex items-center justify-center p-3 sm:p-6 text-slate-800">

    <main class="w-full max-w-2xl mx-auto">
        
        <!-- 1. WELCOME SCREEN -->
        <section id="welcome-screen" class="glass-card rounded-3xl p-6 sm:p-10 shadow-2xl text-center space-y-6">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-tr from-amber-400 to-orange-500 rounded-3xl shadow-lg transform -rotate-6 mb-2">
                <i class="fa-solid fa-person-running text-4xl text-white"></i>
            </div>
            <div>
                <span class="bg-indigo-100 text-indigo-700 text-xs font-extrabold px-3 py-1.5 rounded-full uppercase tracking-wider">PJOK Kelas 7 SMP</span>
                <h1 class="heading-font text-3xl sm:text-4xl font-extrabold text-slate-900 mt-2">Kuis Kebugaran Jasmani 🏃‍♂️💨</h1>
                <p class="text-slate-600 mt-2 text-sm sm:text-base">Uji pemahamanmu tentang daya tahan, kekuatan, kelincahan, dan kesehatan tubuh!</p>
            </div>

            <form id="student-form" onsubmit="startQuiz(event)" class="space-y-4 text-left max-w-md mx-auto pt-2">
                <div>
                    <label for="student-name" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Nama Lengkap</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-4 top-3.5 text-slate-400"></i>
                        <input type="text" id="student-name" required placeholder="Contoh: Budi Pratama" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label for="student-class" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Kelas</label>
                        <select id="student-class" required class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all">
                            <option value="7-A">7-A</option>
                            <option value="7-B">7-B</option>
                            <option value="7-C">7-C</option>
                            <option value="7-D">7-D</option>
                            <option value="7-E">7-E</option>
                            <option value="7-F">7-F</option>
                        </select>
                    </div>
                    <div>
                        <label for="student-absent" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">No. Absen</label>
                        <input type="number" id="student-absent" min="1" max="50" required placeholder="15" class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all">
                    </div>
                </div>

                <button type="submit" class="w-full py-4 bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold text-lg rounded-xl shadow-lg hover:from-indigo-700 hover:to-violet-700 transition-all flex items-center justify-center gap-2 mt-4">
                    <span>Mulai Kuis</span>
                    <i class="fa-solid fa-circle-play"></i>
                </button>
            </form>
        </section>

        <!-- 2. QUIZ SCREEN -->
        <section id="quiz-screen" class="glass-card rounded-3xl p-5 sm:p-8 shadow-2xl hidden space-y-6">
            <!-- Header Info -->
            <div class="flex items-center justify-between border-b border-slate-200/80 pb-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 font-bold">
                        <i class="fa-solid fa-user-graduate"></i>
                    </div>
                    <div>
                        <p id="display-student-info" class="text-xs font-extrabold text-indigo-600 uppercase tracking-wide">Siswa</p>
                        <p class="text-xs text-slate-500">Kuis Kebugaran Jasmani</p>
                    </div>
                </div>
                <div class="text-right">
                    <span id="question-badge" class="bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1 rounded-full">Soal 1/10</span>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
                <div id="progress-bar" class="bg-gradient-to-r from-indigo-500 to-pink-500 h-2.5 rounded-full transition-all duration-300" style="width: 10%"></div>
            </div>

            <!-- Question Area -->
            <div>
                <h2 id="question-text" class="heading-font text-lg sm:text-xl font-bold text-slate-900 leading-snug min-h-[60px]">
                    <!-- Text soal disuntik lewat JS -->
                </h2>
            </div>

            <!-- Options Container -->
            <div id="options-container" class="grid grid-cols-1 gap-3">
                <!-- Pilihan disuntik via JS -->
            </div>

            <!-- Explanation Box (Hidden by default) -->
            <div id="explanation-box" class="hidden p-4 rounded-xl bg-slate-100 border-l-4 border-indigo-500 space-y-1 transition-all">
                <p class="text-xs font-bold uppercase tracking-wider text-indigo-600 flex items-center gap-1.5">
                    <i class="fa-solid fa-lightbulb"></i> Pembahasan:
                </p>
                <p id="explanation-text" class="text-sm text-slate-700 leading-relaxed"></p>
            </div>

            <!-- Action Button -->
            <div class="pt-2 flex justify-end">
                <button id="next-btn" onclick="nextQuestion()" disabled class="px-6 py-3 bg-slate-300 text-slate-500 font-bold text-sm rounded-xl transition-all cursor-not-allowed flex items-center gap-2">
                    <span>Lanjut Soal</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </section>

        <!-- 3. RESULT SCREEN -->
        <section id="result-screen" class="glass-card rounded-3xl p-6 sm:p-8 shadow-2xl hidden text-center space-y-6">
            <div class="relative inline-block">
                <div id="badge-icon-bg" class="w-24 h-24 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center text-5xl mx-auto shadow-inner">
                    <i id="badge-icon" class="fa-solid fa-trophy"></i>
                </div>
            </div>

            <div>
                <h2 class="heading-font text-2xl sm:text-3xl font-extrabold text-slate-900">Hasil Kuis Kamu!</h2>
                <p id="result-student-name" class="text-slate-600 text-sm mt-1"></p>
            </div>

            <!-- Score Box -->
            <div class="bg-gradient-to-br from-slate-900 to-indigo-950 text-white rounded-2xl p-6 shadow-xl relative overflow-hidden">
                <div class="absolute -right-4 -bottom-4 opacity-10 text-8xl">
                    <i class="fa-solid fa-award"></i>
                </div>
                <p class="text-xs uppercase font-bold tracking-widest text-indigo-300">Nilai Akhir</p>
                <div class="text-5xl font-extrabold heading-font text-amber-400 my-2" id="final-score">0</div>
                <p id="result-feedback" class="text-sm font-semibold text-indigo-100"></p>
            </div>

            <!-- Stats grid -->
            <div class="grid grid-cols-2 gap-3 text-left">
                <div class="p-3.5 bg-emerald-50 border border-emerald-200 rounded-xl flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg bg-emerald-500 text-white flex items-center justify-center font-bold">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <div>
                        <p class="text-xs text-slate-500">Jawaban Benar</p>
                        <p id="correct-count" class="text-lg font-bold text-emerald-700">0</p>
                    </div>
                </div>
                <div class="p-3.5 bg-rose-50 border border-rose-200 rounded-xl flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg bg-rose-500 text-white flex items-center justify-center font-bold">
                        <i class="fa-solid fa-xmark"></i>
                    </div>
                    <div>
                        <p class="text-xs text-slate-500">Jawaban Salah</p>
                        <p id="incorrect-count" class="text-lg font-bold text-rose-700">0</p>
                    </div>
                </div>
            </div>

            <!-- Accordion Breakdown -->
            <div class="text-left space-y-3 pt-2">
                <h3 class="font-bold text-slate-800 text-sm flex items-center justify-between">
                    <span>Ringkasan Jawaban</span>
                    <span class="text-xs font-normal text-slate-500">(10 Soal)</span>
                </h3>
                <div id="summary-container" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                    <!-- Dynamic summary -->
                </div>
            </div>

            <button onclick="restartQuiz()" class="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold rounded-xl shadow-lg hover:from-indigo-700 hover:to-violet-700 transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate-right"></i>
                <span>Coba Lagi</span>
            </button>
        </section>

    </main>

    <script>
        // Data Soal Lengkap
        const quizData = [
            {
                question: "Seorang siswa kelas 7 dikatakan memiliki derajat kebugaran jasmani yang baik apabila setelah menyelesaikan seluruh aktivitas belajar di sekolah, ia...",
                options: [
                    "Tidak mampu melanjutkan tugas kelompok di sore hari",
                    "Harus segera tidur karena merasa kelelahan yang luar biasa",
                    "Masih memiliki sisa energi untuk melakukan aktivitas atau hobi di sore hari",
                    "Mengalami sakit kepala dan lemas sepanjang hari"
                ],
                correct: 2,
                explanation: "Kebugaran jasmani adalah kemampuan tubuh untuk melakukan aktivitas sehari-hari tanpa mengalami kelelahan berlebihan dan masih memiliki cadangan energi untuk aktivitas lainnya."
            },
            {
                question: "Latihan fisik dan kebugaran jasmani teratur memberikan pengaruh positif terhadap kesehatan mental peserta didik, salah satunya ditunjukkan melalui...",
                options: [
                    "Peningkatan daya ingat, fokus, dan meredakan stres/kecemasan",
                    "Penurunan kadar oksigen yang menuju ke otak",
                    "Penurunan daya ingat saat belajar",
                    "Peningkatan risiko obesitas dan hipertensi"
                ],
                correct: 0,
                explanation: "Latihan fisik meningkatkan aliran darah dan oksigen ke otak serta merangsang hormon endorfin yang dapat meningkatkan fokus dan mengurangi stres."
            },
            {
                question: "Pada saat melakukan gerakan sit-up, komponen kebugaran jasmani utama yang sedang dilatih dan diukur pada area otot perut adalah...",
                options: [
                    "Kekuatan (Strength)",
                    "Kelincahan (Agility)",
                    "Kelenturan (Flexibility)",
                    "Kecepatan (Speed)"
                ],
                correct: 0,
                explanation: "Sit-up melatih dan mengukur kekuatan (strength) serta daya tahan otot perut."
            },
            {
                question: "Peserta didik yang ingin mengukur tingkat kelincahan gerak tubuhnya dalam mengubah arah dengan cepat dapat menggunakan instrumen tes...",
                options: [
                    "Lari 50 meter",
                    "Beep test",
                    "Sit and reach",
                    "Tes T (T-Test)"
                ],
                correct: 3,
                explanation: "Tes T (T-Test) dirancang khusus untuk mengukur kelincahan (agility), yaitu kemampuan mengubah arah gerakan dengan cepat dan seimbang."
            },
            {
                question: "Instrumen tes sit and reach dilakukan oleh siswa untuk mengukur tingkat...",
                options: [
                    "Kelenturan (flexibility) sendi dan otot",
                    "Kekuatan otot lengan dan dada",
                    "Kelancaran sirkulasi darah",
                    "Daya tahan jantung dan paru-paru"
                ],
                correct: 0,
                explanation: "Tes Sit and Reach mengukur kelenturan (flexibility) punggung bawah dan otot paha belakang (hamstring)."
            },
            {
                question: "Seorang siswa diminta melakukan gerakan berdiri di atas satu kaki dengan mata tertutup selama beberapa detik. Komponen fisik yang sedang diuji adalah...",
                options: [
                    "Keseimbangan",
                    "Koordinasi",
                    "Kelincahan",
                    "Kecepatan"
                ],
                correct: 0,
                explanation: "Berdiri satu kaki (stork balance test) bertujuan untuk menguji kemampuan mempertahankan keseimbangan tubuh statis."
            },
            {
                question: "Kemampuan menyelaraskan penglihatan mata dengan kecermatan gerak tangan saat melempar dan menangkap bola dinamakan...",
                options: [
                    "Kelenturan",
                    "Kekuatan",
                    "Koordinasi",
                    "Keseimbangan"
                ],
                correct: 2,
                explanation: "Koordinasi adalah kemampuan untuk menggabungkan beberapa gerakan tubuh yang berbeda menjadi satu gerakan yang harmonis (misal: koordinasi mata-tangan)."
            },
            {
                question: "Pengukuran kemampuan daya tahan jantung dan paru-paru (aerobik) peserta didik secara bertahap dan sistematis paling tepat menggunakan instrumen...",
                options: [
                    "Berdiri satu kaki",
                    "Tes Sit-up",
                    "Lempar tangkap bola",
                    "Beep Test (Multistage Fitness Test)"
                ],
                correct: 3,
                explanation: "Beep Test atau Multistage Fitness Test adalah tes lari bolak-balik bertahap untuk mengukur kapasitas aerobik dan daya tahan jantung-paru (VO2 Max)."
            },
            {
                question: "Manfaat kebugaran jasmani dalam mendukung kesehatan fisik dan pencegahan penyakit jangka panjang adalah...",
                options: [
                    "Menghambat peredaran darah dan sirkulasi oksigen ke otak",
                    "Menurunkan risiko terkena penyakit jantung, diabetes, dan hipertensi",
                    "Mengurangi tingkat massa otot dan energi harian",
                    "Mempercepat munculnya rasa lelah saat berolahraga"
                ],
                correct: 1,
                explanation: "Kebugaran jasmani yang terjaga dapat menjaga kesehatan pembuluh darah, sensitivitas insulin, dan tekanan darah sehingga menurunkan risiko penyakit degeneratif."
            },
            {
                question: "Catatan waktu tempuh terkecil (tercepat) yang dicapai siswa saat melakukan tes lari 50 meter menunjukkan bahwa siswa tersebut memiliki tingkat...",
                options: [
                    "Kecepatan (Speed) yang makin baik",
                    "Daya tahan jantung yang sangat tinggi",
                    "Keseimbangan tubuh yang stabil",
                    "Kelenturan sendi yang sangat fleksibel"
                ],
                correct: 0,
                explanation: "Tes lari jarak pendek (50 meter) digunakan untuk mengukur kecepatan (speed) dalam menempuh jarak tertentu dalam waktu sesingkat-singkatnya."
            }
        ];

        // App State
        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = [];
        let studentData = { name: '', class: '', absent: '' };

        // Web Audio API Sound Effects
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.exponentialRampToValueAtTime(659.25, audioCtx.currentTime + 0.15); // E5
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, audioCtx.currentTime); // A3
                osc.frequency.exponentialRampToValueAtTime(130.81, audioCtx.currentTime + 0.2); // C3
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // Start Quiz
        function startQuiz(e) {
            e.preventDefault();
            studentData.name = document.getElementById('student-name').value.trim();
            studentData.class = document.getElementById('student-class').value;
            studentData.absent = document.getElementById('student-absent').value;

            document.getElementById('display-student-info').textContent = `${studentData.name} (${studentData.class} / ${studentData.absent})`;

            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');

            currentQuestionIndex = 0;
            score = 0;
            userAnswers = [];
            loadQuestion();
        }

        // Load Question
        function loadQuestion() {
            const currentData = quizData[currentQuestionIndex];
            
            // Progress Update
            const progressPercent = ((currentQuestionIndex + 1) / quizData.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;
            document.getElementById('question-badge').textContent = `Soal ${currentQuestionIndex + 1}/${quizData.length}`;

            // Question Text
            document.getElementById('question-text').textContent = currentData.question;

            // Options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            const optionLabels = ['A', 'B', 'C', 'D'];

            currentData.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full p-4 text-left border-2 border-slate-200 rounded-2xl bg-white hover:border-indigo-400 hover:bg-indigo-50/50 flex items-start gap-3 text-slate-800 text-sm font-semibold transition-all`;
                btn.onclick = () => selectOption(idx);
                
                btn.innerHTML = `
                    <span class="w-7 h-7 rounded-lg bg-slate-100 text-slate-600 font-extrabold flex items-center justify-center shrink-0 border border-slate-300 text-xs">${optionLabels[idx]}</span>
                    <span class="mt-0.5">${opt}</span>
                `;
                optionsContainer.appendChild(btn);
            });

            // Reset Explanation & Next Button
            document.getElementById('explanation-box').classList.add('hidden');
            const nextBtn = document.getElementById('next-btn');
            nextBtn.disabled = true;
            nextBtn.className = "px-6 py-3 bg-slate-300 text-slate-500 font-bold text-sm rounded-xl transition-all cursor-not-allowed flex items-center gap-2";
            nextBtn.innerHTML = currentQuestionIndex === quizData.length - 1 
                ? `<span>Lihat Hasil</span> <i class="fa-solid fa-flag-checkered"></i>`
                : `<span>Lanjut Soal</span> <i class="fa-solid fa-arrow-right"></i>`;
        }

        // Handle Select Option
        function selectOption(selectedIndex) {
            const currentData = quizData[currentQuestionIndex];
            const buttons = document.getElementById('options-container').querySelectorAll('button');

            // Disable all buttons once selected
            buttons.forEach(btn => btn.disabled = true);

            const isCorrect = selectedIndex === currentData.correct;
            userAnswers.push({
                questionIndex: currentQuestionIndex,
                selected: selectedIndex,
                isCorrect: isCorrect
            });

            if (isCorrect) {
                score += 10; // Total 10 soal = 100
                playSound('correct');
                buttons[selectedIndex].className = "option-btn w-full p-4 text-left border-2 border-emerald-500 bg-emerald-50 text-emerald-900 rounded-2xl flex items-start gap-3 text-sm font-bold shadow-md";
                buttons[selectedIndex].querySelector('span').className = "w-7 h-7 rounded-lg bg-emerald-500 text-white font-extrabold flex items-center justify-center shrink-0 text-xs";
            } else {
                playSound('wrong');
                // Wrong option style
                buttons[selectedIndex].className = "option-btn w-full p-4 text-left border-2 border-rose-500 bg-rose-50 text-rose-900 rounded-2xl flex items-start gap-3 text-sm font-semibold";
                buttons[selectedIndex].querySelector('span').className = "w-7 h-7 rounded-lg bg-rose-500 text-white font-extrabold flex items-center justify-center shrink-0 text-xs";

                // Highlight correct answer
                buttons[currentData.correct].className = "option-btn w-full p-4 text-left border-2 border-emerald-500 bg-emerald-50 text-emerald-900 rounded-2xl flex items-start gap-3 text-sm font-semibold";
                buttons[currentData.correct].querySelector('span').className = "w-7 h-7 rounded-lg bg-emerald-500 text-white font-extrabold flex items-center justify-center shrink-0 text-xs";
            }

            // Show explanation
            document.getElementById('explanation-text').textContent = currentData.explanation;
            document.getElementById('explanation-box').classList.remove('hidden');

            // Enable Next Button
            const nextBtn = document.getElementById('next-btn');
            nextBtn.disabled = false;
            nextBtn.className = "px-6 py-3 bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold text-sm rounded-xl shadow-lg hover:from-indigo-700 hover:to-violet-700 transition-all pulse-btn flex items-center gap-2";
        }

        // Next Question or Finish
        function nextQuestion() {
            if (currentQuestionIndex < quizData.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                showResults();
            }
        }

        // Show Results Screen
        function showResults() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            document.getElementById('result-student-name').textContent = `${studentData.name} (${studentData.class} - Absen ${studentData.absent})`;
            document.getElementById('final-score').textContent = score;

            const correctCount = userAnswers.filter(a => a.isCorrect).length;
            const incorrectCount = quizData.length - correctCount;

            document.getElementById('correct-count').textContent = correctCount;
            document.getElementById('incorrect-count').textContent = incorrectCount;

            // Feedback & Badge
            const badgeIcon = document.getElementById('badge-icon');
            const badgeBg = document.getElementById('badge-icon-bg');
            const feedbackText = document.getElementById('result-feedback');

            if (score >= 90) {
                badgeIcon.className = "fa-solid fa-trophy";
                badgeBg.className = "w-24 h-24 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center text-5xl mx-auto shadow-inner ring-8 ring-amber-50";
                feedbackText.textContent = "Luar biasa! Kamu Juara Kebugaran Jasmani! 🏆";
            } else if (score >= 70) {
                badgeIcon.className = "fa-solid fa-medal";
                badgeBg.className = "w-24 h-24 bg-indigo-100 text-indigo-500 rounded-full flex items-center justify-center text-5xl mx-auto shadow-inner ring-8 ring-indigo-50";
                feedbackText.textContent = "Hebat! Pemahamanmu sudah sangat baik! 🥇";
            } else {
                badgeIcon.className = "fa-solid fa-dumbbell";
                badgeBg.className = "w-24 h-24 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center text-5xl mx-auto shadow-inner ring-8 ring-rose-50";
                feedbackText.textContent = "Tetap semangat! Ayo pelajari lagi materi fisikmu! 💪";
            }

            // Populate Summary
            const summaryContainer = document.getElementById('summary-container');
            summaryContainer.innerHTML = '';

            quizData.forEach((q, idx) => {
                const ans = userAnswers.find(a => a.questionIndex === idx);
                const isCorrect = ans ? ans.isCorrect : false;

                const item = document.createElement('div');
                item.className = `p-3 rounded-xl border text-xs ${isCorrect ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'}`;
                item.innerHTML = `
                    <div class="flex items-center justify-between font-bold mb-1">
                        <span class="${isCorrect ? 'text-emerald-800' : 'text-rose-800'}">Soal ${idx + 1}</span>
                        <span class="${isCorrect ? 'text-emerald-600' : 'text-rose-600'} flex items-center gap-1">
                            <i class="fa-solid ${isCorrect ? 'fa-circle-check' : 'fa-circle-xmark'}"></i>
                            ${isCorrect ? 'Benar' : 'Salah'}
                        </span>
                    </div>
                    <p class="text-slate-600 truncate">${q.question}</p>
                `;
                summaryContainer.appendChild(item);
            });
        }

        // Restart Quiz
        function restartQuiz() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('welcome-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
